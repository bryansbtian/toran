# SPDX-License-Identifier: MIT
#
# Optional clamd configuration for Toran.
#
# The upstream clamav/clamav image works with its own defaults; this file exists
# so operators can tune limits without building a custom image. Mount it read-only:
#
#   volumes:
#     - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro

# --- Network ---------------------------------------------------------------
# Toran speaks the INSTREAM protocol over TCP. Bind to all interfaces inside
# the container; the Compose network is what restricts who can reach it.
# clamd MUST NOT be exposed to the internet - it has no authentication.
TCPSocket 3310
TCPAddr 0.0.0.0

# --- Logging ---------------------------------------------------------------
LogTime yes
LogClean no
LogVerbose no
LogSyslog no
Foreground yes

# --- Size limits -----------------------------------------------------------
# These MUST be at least as large as TORAN_MAX_FILE_SIZE_BYTES. If clamd
# refuses to scan a file because it is too large, Toran fails closed and the
# file never becomes downloadable - which is correct, but surprising if the
# real cause is a mismatched limit here.
#
# Defaults below match Toran's default TORAN_MAX_FILE_SIZE_BYTES of 100 MiB
# with headroom for archive expansion.
StreamMaxLength 128M
MaxScanSize 400M
MaxFileSize 128M

# --- Archive handling ------------------------------------------------------
# Bounds on recursive extraction. These are the protection against zip bombs:
# raising them increases coverage of deeply nested archives and increases the
# resources a single hostile file can consume.
MaxRecursion 12
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 4M

# Report archives that could not be fully scanned rather than silently passing
# them. Toran treats a clamd error as "not clean" and will not mark the file
# ready, which is the fail-closed behaviour we want.
AlertExceedsMax yes
AlertEncrypted no
AlertEncryptedArchive no
AlertEncryptedDoc no

# --- Detection -------------------------------------------------------------
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes
ScanMail yes
# Potentially unwanted applications: off by default because the false-positive
# rate is high for a general-purpose file-sharing service.
DetectPUA no

# --- Concurrency -----------------------------------------------------------
# Should be at least TORAN_WORKER_CONCURRENCY, or scans will queue behind each
# other. Each thread needs memory, so raise this together with the container's
# memory limit.
MaxThreads 4
MaxQueue 100
ReadTimeout 300
CommandReadTimeout 30
MaxConnectionQueueLength 30

# --- Hardening -------------------------------------------------------------
# clamd parses hostile input by design. Never run it as root.
User clamav
ExitOnOOM yes
SelfCheck 3600
