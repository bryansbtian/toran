# Development infrastructure only: PostgreSQL, MinIO and ClamAV.
# The Toran web app and worker run on the host via `npm run dev`.
#
#   npm run dev:setup      start these, create the bucket, run migrations
#   npm run dev:infra      start these only
#   npm run dev:infra:down stop them
#
# Ports are published to localhost so host processes can reach them. This file
# is NOT for production - see docker-compose.yml.

name: toran-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: toran-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toran}
      POSTGRES_DB: ${POSTGRES_DB:-toran}
      # Deterministic collation so index behaviour matches production images.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - toran-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-toran} -d ${POSTGRES_DB:-toran}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: toran-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-toranminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-toranminio-dev-secret}
      # Browsers PUT directly to MinIO, so it must accept our origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${TORAN_APP_URL:-http://localhost:3000}
    ports:
      # Loopback by default. `npm run dev` sets MINIO_BIND_ADDRESS=0.0.0.0 so
      # browsers on other machines can follow a download redirect here.
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:9000:9000'
      # The console stays on loopback either way; it is an admin surface.
      - '127.0.0.1:9001:9001'
    volumes:
      - toran-dev-minio:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  clamav:
    image: clamav/clamav:1.4
    container_name: toran-dev-clamav
    restart: unless-stopped
    environment:
      # Keep the first start fast; freshclam still updates in the background.
      CLAMAV_NO_FRESHCLAMD: 'false'
      FRESHCLAM_CHECKS: '1'
    ports:
      - '127.0.0.1:3310:3310'
    volumes:
      - toran-dev-clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 15s
      timeout: 10s
      # ClamAV loads its signature database on first boot, which is slow.
      retries: 40
      start_period: 120s

volumes:
  toran-dev-postgres:
  toran-dev-minio:
  toran-dev-clamav:
