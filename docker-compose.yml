# SPDX-License-Identifier: MIT
#
# Production self-hosting stack for Toran.
#
#   Create .env from .env.example, EDIT IT - Toran refuses to start with the
#   example values - and then:
#
#   docker compose up -d
#
# See docs/DEPLOYMENT.md for what to set.
#
# What this gives you:
#   toran-web      the application (the only service that needs a public port)
#   toran-worker   malware scanning, cleanup jobs, storage reconciliation
#   postgres       metadata
#   minio          object storage (files never pass through toran-web)
#   clamav         malware scanning
#
# Only the web app publishes a port. Put a TLS-terminating reverse proxy in
# front of it; see docs/DEPLOYMENT.md.

name: toran

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'

services:
  web:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: toran-web:local
    container_name: toran-web
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      # The web tier must not serve requests against an unmigrated schema. On a
      # first `docker compose up` the database is healthy well before the
      # migration container has finished, so without this the app would answer
      # traffic with "relation does not exist" until migrate caught up.
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: '3000'
      TORAN_APP_URL: ${TORAN_APP_URL:?set TORAN_APP_URL in .env}
      TORAN_DOWNLOAD_URL: ${TORAN_DOWNLOAD_URL:?set TORAN_DOWNLOAD_URL in .env}
      TORAN_SECRET_KEY: ${TORAN_SECRET_KEY:?set TORAN_SECRET_KEY in .env}
      TORAN_SECURE_COOKIES: ${TORAN_SECURE_COOKIES:-true}
      TORAN_LOG_LEVEL: ${TORAN_LOG_LEVEL:-info}
      TORAN_TRUSTED_PROXIES: ${TORAN_TRUSTED_PROXIES:-}
      TORAN_ABUSE_CONTACT_EMAIL: ${TORAN_ABUSE_CONTACT_EMAIL:-abuse@example.invalid}
      DATABASE_URL: postgres://${POSTGRES_USER:-toran}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-toran}
      # Signed in-cluster, rewritten to the public host the browser can reach.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${TORAN_DOWNLOAD_URL}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-toran}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_FORCE_PATH_STYLE: 'true'
      TORAN_MAX_FILE_SIZE_BYTES: ${TORAN_MAX_FILE_SIZE_BYTES:-104857600}
      TORAN_DEFAULT_EXPIRY_SECONDS: ${TORAN_DEFAULT_EXPIRY_SECONDS:-86400}
      TORAN_MAX_EXPIRY_SECONDS: ${TORAN_MAX_EXPIRY_SECONDS:-604800}
      # A shared limiter is mandatory in production; the in-memory one is
      # per-process and Toran refuses to start with it.
      TORAN_RATE_LIMIT_BACKEND: postgres
      TORAN_SCANNING_ENABLED: ${TORAN_SCANNING_ENABLED:-true}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
    ports:
      - '${TORAN_BIND_ADDRESS:-127.0.0.1}:${TORAN_PORT:-3000}:3000'
    networks: [toran]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Example resource limits. Tune for your host; remove if using Swarm.
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
        reservations: { cpus: '0.25', memory: 256M }

  worker:
    <<: [*restart, *logging]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: toran-worker:local
    container_name: toran-worker
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      TORAN_APP_URL: ${TORAN_APP_URL}
      TORAN_DOWNLOAD_URL: ${TORAN_DOWNLOAD_URL}
      TORAN_SECRET_KEY: ${TORAN_SECRET_KEY}
      TORAN_SECURE_COOKIES: ${TORAN_SECURE_COOKIES:-true}
      TORAN_LOG_LEVEL: ${TORAN_LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-toran}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toran}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-toran}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: 'true'
      TORAN_RATE_LIMIT_BACKEND: postgres
      TORAN_SCANNING_ENABLED: ${TORAN_SCANNING_ENABLED:-true}
      TORAN_BLOCKED_FILE_ACTION: ${TORAN_BLOCKED_FILE_ACTION:-quarantine}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      TORAN_WORKER_CONCURRENCY: ${TORAN_WORKER_CONCURRENCY:-2}
      TORAN_CLEANUP_INTERVAL_SECONDS: ${TORAN_CLEANUP_INTERVAL_SECONDS:-300}
    networks: [toran]
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
        reservations: { cpus: '0.25', memory: 128M }

  # Applies pending migrations once, then exits. Runs before the worker and is
  # a separate service so migrations are never raced by two starting replicas.
  migrate:
    <<: *logging
    image: toran-worker:local
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: toran-migrate
    restart: 'no'
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      TORAN_APP_URL: ${TORAN_APP_URL}
      TORAN_DOWNLOAD_URL: ${TORAN_DOWNLOAD_URL}
      TORAN_SECRET_KEY: ${TORAN_SECRET_KEY}
      TORAN_SECURE_COOKIES: ${TORAN_SECURE_COOKIES:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-toran}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-toran}
      S3_BUCKET: ${S3_BUCKET:-toran}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      TORAN_RATE_LIMIT_BACKEND: postgres
    command: ['node', '--enable-source-maps', 'packages/database/dist/scripts/migrate.js']
    networks: [toran]

  postgres:
    <<: [*restart, *logging]
    image: postgres:17-alpine
    container_name: toran-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-toran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-toran}
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [toran]
    # No published port: only the Toran services need to reach the database.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-toran} -d ${POSTGRES_DB:-toran}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  minio:
    <<: [*restart, *logging]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: toran-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # Browsers PUT directly to storage, so it must accept the app origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${TORAN_APP_URL}
      MINIO_BROWSER: ${MINIO_BROWSER:-off}
    volumes:
      - minio-data:/data
    networks: [toran]
    # Publish this only if browsers reach MinIO directly rather than through
    # your reverse proxy. See docs/DEPLOYMENT.md for the proxy configuration.
    ports:
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000'
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1G }

  # Creates the bucket on first boot and keeps it private, then exits.
  minio-init:
    <<: *logging
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: toran-minio-init
    restart: 'no'
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set toran http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing toran/"$$S3_BUCKET"
        mc anonymous set none toran/"$$S3_BUCKET"
        echo "bucket $$S3_BUCKET is ready and private"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-toran}
    networks: [toran]

  clamav:
    <<: [*restart, *logging]
    image: clamav/clamav:1.4
    container_name: toran-clamav
    environment:
      # freshclam keeps signatures current. Stale signatures are worse than
      # useless: they give false confidence. See docs/THREAT_MODEL.md.
      FRESHCLAM_CHECKS: '2'
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [toran]
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 30s
      timeout: 10s
      # The signature database download on first boot takes minutes.
      retries: 20
      start_period: 300s
    deploy:
      resources:
        # ClamAV holds its whole signature database in memory.
        limits: { cpus: '2.0', memory: 3G }
        reservations: { memory: 1536M }

volumes:
  postgres-data:
  minio-data:
  clamav-data:

networks:
  toran:
    driver: bridge
