# SPDX-License-Identifier: MIT
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/toran-project/toran/security/advisories/new
    about: Report privately through a GitHub security advisory. Never open a public issue for a vulnerability.
  - name: Report abusive content on a Toran instance
    url: https://github.com/toran-project/toran/blob/main/docs/ABUSE.md
    about: Contact the operator of that instance, not this repository.
  - name: Questions and discussion
    url: https://github.com/toran-project/toran/discussions
    about: Ask how to do something, or propose an idea before opening an issue.
