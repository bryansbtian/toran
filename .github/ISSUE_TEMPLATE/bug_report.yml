# SPDX-License-Identifier: MIT
name: Bug report
description: Something in Toran does not work as documented.
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Do not open an issue for a security vulnerability.** Follow
        [SECURITY.md](../../SECURITY.md) to report it privately instead.

        **Never paste a real share link, password, or storage credential here.**
        Issues are public. Redact them, or describe them instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a 12 MB PDF with a 1-day expiry
        2. Open the link in a private window
        3. ...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Toran?
      options:
        - Local development (npm run dev)
        - Docker Compose (self-hosted)
        - Managed platform (Vercel, Fly, Railway, ...)
        - Kubernetes or other orchestrator
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Toran version or commit
      placeholder: v0.1.0, or the commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Node.js, npm and Docker versions
      placeholder: 'node 22.13.0, npm 10.9.2, Docker 27.4.0'

  - type: dropdown
    id: storage
    attributes:
      label: Object storage
      options:
        - MinIO (default)
        - AWS S3
        - Cloudflare R2
        - Backblaze B2
        - Other S3-compatible
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Toran logs structured JSON. Include the `requestId` if you have it.
        Toran redacts tokens and credentials, but please check before pasting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I removed every share link, password and credential from this report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
