# SPDX-License-Identifier: MIT
name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 5 * * 1'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Only meaningful on a pull request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          # Toran's dependency policy rejects GPL and AGPL dependencies so that
          # the distributed application can remain compatible with the project's
          # intended permissive licensing model. That is a project decision
          # about what Toran ships, not legal advice.
          # LGPL is deliberately NOT denied - it is designed to be used from a
          # differently licensed work, and Toran already depends on LGPL native
          # binaries through sharp. See docs/LICENSING.md.
          # This is an automated first pass, NOT a legal review - see
          # docs/LICENSING.md before any commercial launch.
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0,
            BUSL-1.1,
            Elastic-2.0,
            CC-BY-NC-4.0, CC-BY-NC-SA-4.0,
            JSON

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Fails on any high or critical advisory in a shipping dependency that has
      # not been individually reviewed. The reviewed exceptions, and why each
      # vulnerable path is unreachable from Toran, are in the script itself.
      #
      # A bare `npm audit --omit=dev --audit-level=high` used to run here. It
      # cannot distinguish "nothing to fix" from "cannot be fixed yet": Next.js
      # currently pins a vulnerable postcss and ships a vulnerable sharp, with no
      # released Next version that does otherwise, so the step was red on every
      # pull request regardless of what the pull request changed.
      - name: Audit production dependencies
        run: npm run audit:prod

      # Dev-only advisories are reported but do not block: they cannot reach a
      # deployed instance.
      - name: Report development advisories (non-blocking)
        run: npm audit --audit-level=high || true

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Pinned, not `@latest`. `npx --yes` executes whatever the registry
      # serves, so an unpinned tool is an unreviewed dependency running with
      # this workflow's token on every push. Bump it deliberately.
      - name: Generate a CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.0 --output-file sbom.cdx.json --omit dev

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  licenses:
    name: Dependency licence inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund

      # Pinned for the same reason as the SBOM tool above.
      - name: List production dependency licences
        run: >-
          npx --yes license-checker-rseidelsohn@5.0.1
          --production --summary --excludePrivatePackages
