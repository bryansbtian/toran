# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels the previous run; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Fast feedback: formatting, linting, types and unit tests need no services.
  static:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Keys the cache on package-lock.json, so a poisoned cache cannot
          # survive a dependency change.
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Migrations must apply to an empty database and be idempotent.
  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toran
          POSTGRES_PASSWORD: toran
          POSTGRES_DB: toran
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U toran -d toran"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://toran:toran@localhost:5432/toran
      TORAN_SECRET_KEY: ci-only-secret-key-not-used-in-production-000
      S3_BUCKET: toran
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace=@toran/shared
      - run: npm run build --workspace=@toran/config
      - run: npm run build --workspace=@toran/security
      - run: npm run build --workspace=@toran/storage
      - run: npm run build --workspace=@toran/database

      - name: Apply migrations to an empty database
        run: npm run db:migrate

      - name: Re-apply migrations (must be a no-op)
        run: npm run db:migrate

      - name: Fail if the schema has uncommitted drift
        run: |
          npm run db:generate --workspace=@toran/database -- --name ci-drift-check
          if [ -n "$(git status --porcelain packages/database/drizzle)" ]; then
            echo "::error::The Drizzle schema has changes with no committed migration."
            echo "Run 'npm run db:generate' and commit the generated SQL."
            git status --porcelain packages/database/drizzle
            exit 1
          fi

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: toran
          POSTGRES_PASSWORD: toran
          POSTGRES_DB: toran
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U toran -d toran"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://toran:toran@localhost:5432/toran
      TORAN_SECRET_KEY: ci-only-secret-key-not-used-in-production-000
      S3_BUCKET: toran
      S3_ACCESS_KEY_ID: ci-access-key
      S3_SECRET_ACCESS_KEY: ci-secret-key
      # Integration tests use in-memory storage and a scripted scanner; no
      # external service is required beyond PostgreSQL.
      TORAN_SCANNING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run db:migrate
      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Start PostgreSQL, MinIO and ClamAV
        run: |
          cp .env.example .env
          docker compose -f docker-compose.dev.yml up -d

      - name: Wait for infrastructure
        run: |
          for service in toran-dev-postgres toran-dev-minio; do
            echo "waiting for $service"
            for _ in $(seq 1 60); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$service" 2>/dev/null || echo starting)
              [ "$status" = "healthy" ] && break
              sleep 2
            done
          done
          # ClamAV downloads its signature database on first boot.
          echo "waiting for clamav"
          for _ in $(seq 1 180); do
            status=$(docker inspect --format '{{.State.Health.Status}}' toran-dev-clamav 2>/dev/null || echo starting)
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          docker ps --filter name=toran-dev --format '{{.Names}} {{.Status}}'

      - name: Create the bucket
        run: |
          docker exec toran-dev-minio mc alias set local http://127.0.0.1:9000 toranminio toranminio-dev-secret
          docker exec toran-dev-minio mc mb --ignore-existing local/toran
          docker exec toran-dev-minio mc anonymous set none local/toran

      - run: npm run build
      - run: npm run db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Start the worker
        run: |
          npm run start --workspace=@toran/worker > /tmp/toran-worker.log 2>&1 &
          echo $! > /tmp/worker.pid
          sleep 5

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Worker logs on failure
        if: failure()
        run: tail -n 200 /tmp/toran-worker.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: toran-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: toran-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Fail if an image runs as root
        run: |
          for image in toran-web:ci toran-worker:ci; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            echo "$image runs as '${user:-root}'"
            if [ -z "$user" ] || [ "$user" = "root" ]; then
              echo "::error::$image must not run as root"
              exit 1
            fi
          done

      - name: Scan images for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: toran-web:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check for committed secrets
        run: node scripts/check-secrets.mjs
